<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Silas Chat</title>
<style>
  :root {
    --bg: #0d0b09;
    --panel: #161310;
    --panel-alt: #1e1a15;
    --border: #2c2620;
    --amber: #e8a33d;
    --amber-dim: #a3762a;
    --text: #f0ebe3;
    --text-dim: #9a9082;
    --bubble-me: #3a2c14;
    --bubble-other: #1e1a15;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- LOGIN SCREEN ---------- */
  #login-screen {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }

  #login-screen h1 {
    font-size: 2rem;
    letter-spacing: 0.02em;
    margin-bottom: 4px;
    color: var(--amber);
  }

  #login-screen p {
    color: var(--text-dim);
    margin-bottom: 32px;
    max-width: 320px;
  }

  #google-signin {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--amber);
    color: #1a1408;
    font-weight: 600;
    font-size: 1rem;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  #google-signin:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 16px rgba(232, 163, 61, 0.25);
  }

  #google-signin svg { width: 18px; height: 18px; }

  #login-error {
    margin-top: 16px;
    color: #e06a5f;
    font-size: 0.85rem;
    max-width: 320px;
  }

  /* ---------- APP LAYOUT ---------- */
  #app {
    height: 100%;
    display: none;
    grid-template-columns: 260px 1fr;
  }

  #app.active { display: grid; }

  /* Sidebar */
  #sidebar {
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  #me {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px;
    border-bottom: 1px solid var(--border);
  }

  #me img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 2px solid var(--amber-dim);
  }

  #me .name {
    font-weight: 600;
    font-size: 0.92rem;
  }

  #sign-out {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.75rem;
    border-radius: 6px;
    padding: 5px 9px;
    cursor: pointer;
  }
  #sign-out:hover { color: var(--text); border-color: var(--amber-dim); }

  #user-list-label {
    padding: 14px 16px 6px;
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
  }

  #user-list {
    list-style: none;
    margin: 0;
    padding: 0 8px;
    overflow-y: auto;
    flex: 1;
  }

  #user-list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 8px;
    font-size: 0.88rem;
    color: var(--text-dim);
  }

  #user-list li img {
    width: 28px;
    height: 28px;
    border-radius: 50%;
  }

  #user-list li .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #4caf50;
    margin-left: auto;
    flex-shrink: 0;
  }

  /* Chat area */
  #chat-area {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-width: 0;
  }

  #chat-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    color: var(--amber);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg {
    display: flex;
    gap: 10px;
    max-width: 70%;
  }

  .msg.mine {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg img {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .msg .bubble {
    background: var(--bubble-other);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 9px 13px;
  }

  .msg.mine .bubble {
    background: var(--bubble-me);
    border-color: var(--amber-dim);
  }

  .msg .sender {
    font-size: 0.72rem;
    color: var(--amber-dim);
    margin-bottom: 3px;
    font-weight: 600;
  }

  .msg.mine .sender { text-align: right; }

  .msg .text {
    font-size: 0.92rem;
    line-height: 1.4;
    word-wrap: break-word;
  }

  .msg .time {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 4px;
  }

  #empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.9rem;
  }

  #input-bar {
    display: flex;
    gap: 10px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  #msg-input {
    flex: 1;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 11px 16px;
    color: var(--text);
    font-size: 0.92rem;
    outline: none;
  }

  #msg-input:focus { border-color: var(--amber-dim); }

  #send-btn {
    background: var(--amber);
    color: #1a1408;
    border: none;
    border-radius: 999px;
    padding: 0 20px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.9rem;
  }

  #send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  @media (max-width: 640px) {
    #app.active { grid-template-columns: 1fr; }
    #sidebar { display: none; }
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen">
  <h1>Silas Chat</h1>
  <p>Sign in with Google to join the conversation.</p>
  <button id="google-signin">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.5 0 10.4-1.8 14.3-5l-6.6-5.4C29.7 35.4 27 36 24 36c-5.3 0-9.7-3.4-11.3-8.1l-6.6 5.1C9.6 39.6 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.2-4.1 5.6l6.6 5.4C41.9 35.7 44 30.3 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
    Sign in with Google
  </button>
  <div id="login-error"></div>
</div>

<!-- MAIN APP -->
<div id="app">
  <div id="sidebar">
    <div id="me">
      <img id="me-avatar" src="" alt="">
      <div class="name" id="me-name"></div>
      <button id="sign-out">Sign out</button>
    </div>
    <div id="user-list-label">People</div>
    <ul id="user-list"></ul>
  </div>

  <div id="chat-area">
    <div id="chat-header">General</div>
    <div id="messages"><div id="empty-state">No messages yet — say hi 👋</div></div>
    <div id="input-bar">
      <input id="msg-input" type="text" placeholder="Type a message..." autocomplete="off">
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    doc,
    setDoc,
    serverTimestamp,
    onSnapshot,
    query,
    orderBy,
    limit
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC8X2VyKzHvUIRWrFlv5Kj0DGSzVsFyIQk",
    authDomain: "silas-chat-5a6f2.firebaseapp.com",
    projectId: "silas-chat-5a6f2",
    storageBucket: "silas-chat-5a6f2.firebasestorage.app",
    messagingSenderId: "384784370168",
    appId: "1:384784370168:web:651ca7964dea468087ae0d",
    measurementId: "G-XL9FPLZGGT"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const provider = new GoogleAuthProvider();

  const loginScreen = document.getElementById("login-screen");
  const appEl = document.getElementById("app");
  const signInBtn = document.getElementById("google-signin");
  const signOutBtn = document.getElementById("sign-out");
  const loginError = document.getElementById("login-error");
  const meAvatar = document.getElementById("me-avatar");
  const meName = document.getElementById("me-name");
  const userListEl = document.getElementById("user-list");
  const messagesEl = document.getElementById("messages");
  const msgInput = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");

  let currentUser = null;
  let unsubMessages = null;
  let unsubUsers = null;

  signInBtn.addEventListener("click", async () => {
    loginError.textContent = "";
    try {
      await signInWithPopup(auth, provider);
    } catch (err) {
      console.error(err);
      loginError.textContent = "Sign-in failed: " + err.message;
    }
  });

  signOutBtn.addEventListener("click", () => signOut(auth));

  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      loginScreen.style.display = "none";
      appEl.classList.add("active");

      meAvatar.src = user.photoURL || "";
      meName.textContent = user.displayName || "Anonymous";

      // Register/update this user in the "users" collection
      await setDoc(doc(db, "users", user.uid), {
        name: user.displayName || "Anonymous",
        photoURL: user.photoURL || "",
        lastSeen: serverTimestamp()
      }, { merge: true });

      listenForUsers();
      listenForMessages();
    } else {
      currentUser = null;
      loginScreen.style.display = "flex";
      appEl.classList.remove("active");
      if (unsubMessages) unsubMessages();
      if (unsubUsers) unsubUsers();
    }
  });

  function listenForUsers() {
    if (unsubUsers) unsubUsers();
    unsubUsers = onSnapshot(collection(db, "users"), (snap) => {
      userListEl.innerHTML = "";
      snap.forEach((docSnap) => {
        const u = docSnap.data();
        const li = document.createElement("li");
        li.innerHTML = `
          <img src="${u.photoURL || ''}" alt="">
          <span>${escapeHtml(u.name || "Anonymous")}</span>
          <span class="dot"></span>
        `;
        userListEl.appendChild(li);
      });
    });
  }

  function listenForMessages() {
    if (unsubMessages) unsubMessages();
    const q = query(collection(db, "messages"), orderBy("createdAt", "asc"), limit(200));
    unsubMessages = onSnapshot(q, (snap) => {
      messagesEl.innerHTML = "";
      if (snap.empty) {
        messagesEl.innerHTML = '<div id="empty-state">No messages yet — say hi 👋</div>';
        return;
      }
      snap.forEach((docSnap) => {
        const m = docSnap.data();
        const isMine = currentUser && m.uid === currentUser.uid;
        const div = document.createElement("div");
        div.className = "msg" + (isMine ? " mine" : "");
        const time = m.createdAt && m.createdAt.toDate
          ? m.createdAt.toDate().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })
          : "";
        div.innerHTML = `
          <img src="${m.photoURL || ''}" alt="">
          <div>
            <div class="bubble">
              <div class="sender">${escapeHtml(m.name || "Anonymous")}</div>
              <div class="text">${escapeHtml(m.text || "")}</div>
            </div>
            <div class="time">${time}</div>
          </div>
        `;
        messagesEl.appendChild(div);
      });
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  async function sendMessage() {
    const text = msgInput.value.trim();
    if (!text || !currentUser) return;
    msgInput.value = "";
    try {
      await addDoc(collection(db, "messages"), {
        text,
        uid: currentUser.uid,
        name: currentUser.displayName || "Anonymous",
        photoURL: currentUser.photoURL || "",
        createdAt: serverTimestamp()
      });
    } catch (err) {
      console.error("Failed to send:", err);
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  msgInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") sendMessage();
  });

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
